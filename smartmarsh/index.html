function choosePage(i){page=i;document.getElementById('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}
function start(){recalc();started=true;playing=true;lastTick=performance.now();page=page===3?0:page;render()}
document.addEventListener('click',function(e){var t=e.target.closest('[data-page],[data-mode],[data-action],[data-sort]');if(!t)return;if(t.dataset.page!==undefined){choosePage(Number(t.dataset.page));return}if(t.dataset.mode){mode=t.dataset.mode;render();return}if(t.dataset.sort){if(sortKey===t.dataset.sort)asc=!asc;else{sortKey=t.dataset.sort;asc=true}render();return}var a=t.dataset.action;if(a==='start')start();else if(a==='pause'){playing=false;render()}else if(a==='resume'){playing=true;started=true;lastTick=performance.now();render()}else if(a==='reset'){playing=false;started=false;clock=0;ack={};render()}else if(a==='defaults'){settings=Object.assign({},defaults);recalc();render()}else if(a==='ack'){ack[selected]=!ack[selected];render()}else if(a==='csv'||a==='xlsx')exportData(a)});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset.setting){var k=t.dataset.setting,d=defs[k],x=Number(t.value);if(!isFinite(x))return;x=Math.max(d[0],Math.min(d[1],x));if(k==='trucks'||k==='gates'||k==='seed')x=Math.round(x);settings[k]=x;if(k!=='speed'){recalc()}else try{localStorage.setItem('smartmarsh.v2',JSON.stringify(settings))}catch(err){}render()}else if(t.id==='driver-select'){selected=t.value;render()}else if(t.id==='filter'){filter=t.value;render()}});
document.addEventListener('input',function(e){if(e.target.id==='filter'){filter=e.target.value;var pos=e.target.selectionStart;render();var el=document.getElementById('filter');if(el){el.focus();el.setSelectionRange(pos,pos)}}});
function tick(now){if(!lastTick)lastTick=now;var dt=Math.min(.12,(now-lastTick)/1000);lastTick=now;if(playing){var cap=Math.max(pair.smart.horizon,pair.traditional.horizon);clock=Math.min(cap,clock+dt*settings.speed);if(clock>=cap){playing=false}if(page===0&&(now-(tick.prev||0)>180)){render();tick.prev=now}}requestAnimationFrame(tick)}
recalc();render();requestAnimationFrame(tick);
})();
</script></body></html>
